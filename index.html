<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Wizard's Chess - Gothic Cathedral</title>
    <!-- Tailwind CSS for Material Design 3 UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Chess.js for Game Logic & Validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: '#121214',
                        surfaceContainer: '#1c1c21',
                        surfaceHigh: '#27272f',
                        primary: '#c4b5fd',
                        onPrimary: '#2e1065',
                        obsidian: '#1a1a24',
                        marble: '#f1f5f9'
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0e;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .gothic-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.15em;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        .glass-panel {
            background: rgba(28, 28, 33, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="flex flex-col relative">

    <!-- TOP APP BAR -->
    <header class="h-16 px-6 glass-panel flex items-center justify-between z-30 shrink-0 border-b border-white/10">
        <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-600 to-indigo-900 flex items-center justify-center shadow-lg shadow-violet-900/30">
                <i class="fa-solid fa-chess-rook text-white text-lg"></i>
            </div>
            <div>
                <h1 class="gothic-title text-lg font-bold bg-gradient-to-r from-white via-violet-200 to-violet-400 bg-clip-text text-transparent">WIZARD'S CHESS</h1>
                <p class="text-xs text-violet-300/70 tracking-wide font-medium">Gothic Cathedral Edition</p>
            </div>
        </div>

        <div class="hidden md:flex items-center space-x-3 px-5 py-2 rounded-full bg-surfaceHigh/80 border border-white/10 shadow-inner">
            <div id="turnIndicatorDot" class="w-3 h-3 rounded-full bg-slate-100 shadow-sm shadow-white/50 animate-pulse"></div>
            <span id="turnText" class="text-sm font-semibold tracking-wide text-slate-200">White's Turn (Marble)</span>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="toggleGameMode()" id="gameModeBtn" class="px-4 py-2 rounded-xl bg-surfaceHigh hover:bg-violet-900/40 text-xs font-semibold text-violet-200 border border-white/10 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-robot"></i>
                <span id="gameModeLabel">Mode: vs AI (Easy)</span>
            </button>
            <button onclick="resetGame()" class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-xs font-semibold text-white shadow-lg shadow-violet-600/30 transition-all flex items-center space-x-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>New Game</span>
            </button>
            <button onclick="toggleAudio()" id="audioBtn" class="w-10 h-10 rounded-xl bg-surfaceHigh hover:bg-violet-900/40 text-slate-300 flex items-center justify-center border border-white/10 transition-all">
                <i class="fa-solid fa-volume-high" id="audioIcon"></i>
            </button>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="flex-1 relative w-full overflow-hidden" style="height: calc(100vh - 4rem);">
        <div id="canvasContainer" class="w-full h-full absolute inset-0 cursor-grab active:cursor-grabbing"></div>

        <!-- Left Panels -->
        <div class="absolute top-6 left-6 z-20 flex flex-col space-y-4 pointer-events-none w-72">
            <div class="md:hidden glass-panel p-4 rounded-2xl pointer-events-auto flex items-center space-x-3 shadow-xl">
                <div id="mobileTurnDot" class="w-3.5 h-3.5 rounded-full bg-slate-100 animate-pulse"></div>
                <span id="mobileTurnText" class="text-sm font-bold text-slate-200">White's Turn</span>
            </div>

            <div class="glass-panel p-4 rounded-2xl pointer-events-auto shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-violet-300/80 font-cinzel">Battle Chronicle</span>
                    <i class="fa-solid fa-skull text-violet-400/60 text-xs"></i>
                </div>
                <div>
                    <div class="text-[10px] font-semibold text-slate-400 mb-1">Shattered Obsidian</div>
                    <div id="capturedObsidian" class="flex flex-wrap gap-1 min-h-[28px] p-1.5 rounded-xl bg-surface/60 border border-white/5"></div>
                </div>
                <div>
                    <div class="text-[10px] font-semibold text-slate-400 mb-1">Shattered Marble</div>
                    <div id="capturedMarble" class="flex flex-wrap gap-1 min-h-[28px] p-1.5 rounded-xl bg-surface/60 border border-white/5"></div>
                </div>
            </div>
        </div>

        <!-- Right Move History -->
        <div class="absolute top-6 right-6 z-20 hidden lg:flex flex-col w-64 pointer-events-none">
            <div class="glass-panel p-4 rounded-2xl pointer-events-auto shadow-xl flex flex-col h-80">
                <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-violet-300/80 font-cinzel">Scroll of Moves</span>
                    <i class="fa-solid fa-scroll text-violet-400/60 text-xs"></i>
                </div>
                <div id="moveHistoryList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs font-mono text-slate-300">
                    <div class="text-slate-500 italic text-center py-8">No spells cast yet...</div>
                </div>
            </div>
        </div>

        <!-- Camera Reset -->
        <div class="absolute bottom-6 right-6 z-20 flex flex-col space-y-3">
            <button onclick="resetCamera()" class="w-12 h-12 rounded-2xl glass-panel hover:bg-violet-900/40 text-slate-200 flex items-center justify-center shadow-xl transition-all border border-white/10 group" title="Reset Camera">
                <i class="fa-solid fa-video text-base group-hover:scale-110 transition-transform"></i>
            </button>
        </div>

        <!-- Modal -->
        <div id="gameModal" class="absolute inset-0 z-40 bg-black/70 backdrop-blur-md flex items-center justify-center hidden">
            <div class="glass-panel p-8 rounded-3xl max-w-md w-full mx-4 text-center shadow-2xl border border-white/20 transform scale-95 opacity-0 transition-all duration-300" id="modalContent">
                <div id="modalIcon" class="w-16 h-16 rounded-2xl bg-violet-600/20 text-violet-400 flex items-center justify-center mx-auto mb-4 text-2xl border border-violet-500/30">
                    <i class="fa-solid fa-chess-king"></i>
                </div>
                <h3 id="modalTitle" class="gothic-title text-2xl font-bold text-white mb-2">Checkmate!</h3>
                <p id="modalDesc" class="text-sm text-slate-300 mb-6 leading-relaxed">The obsidian king has been shattered. Marble claims ultimate victory in the cathedral.</p>
                <button onclick="resetGame(); closeModal();" class="w-full py-3.5 rounded-2xl bg-violet-600 hover:bg-violet-500 font-bold text-white text-sm shadow-xl shadow-violet-600/40 transition-all font-cinzel tracking-wider">
                    New Battle
                </button>
            </div>
        </div>
    </main>

    <script>
        let audioEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'shatter') {
                const bufferSize = audioCtx.sampleRate * 0.4;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(200, now + 0.4);
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.3, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start(now);
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audioIcon').className = audioEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
        }

        const chess = new Chess();
        let gameMode = 'easy';
        let selectedSquare = null;
        let validMoves = [];
        let isAnimating = false;
        let capturedPiecesData = { w: [], b: [] };

        const modeNames = { 'easy': 'Mode: vs AI (Easy)', 'hard': 'Mode: vs AI (Hard)', 'pvp': 'Mode: 2 Player' };

        function toggleGameMode() {
            if (gameMode === 'easy') gameMode = 'hard';
            else if (gameMode === 'hard') gameMode = 'pvp';
            else gameMode = 'easy';
            document.getElementById('gameModeLabel').innerText = modeNames[gameMode];
            resetGame();
        }

        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0e);
        scene.fog = new THREE.FogExp2(0x0b0b0e, 0.035);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 14, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 6;
        controls.maxDistance = 25;
        controls.target.set(0, 0, 0);

        function resetCamera() {
            camera.position.set(0, 14, 11);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        const ambientLight = new THREE.AmbientLight(0x2e2340, 1.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xe2e8f0, 2.0);
        mainLight.position.set(8, 16, 8);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.bias = -0.0001;
        scene.add(mainLight);

        const glassLight1 = new THREE.PointLight(0x8b5cf6, 3, 20);
        glassLight1.position.set(-10, 8, 0);
        scene.add(glassLight1);

        const glassLight2 = new THREE.PointLight(0x3b82f6, 3, 20);
        glassLight2.position.set(10, 8, 0);
        scene.add(glassLight2);

        const boardGroup = new THREE.Group();
        scene.add(boardGroup);

        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        floor.receiveShadow = true;
        scene.add(floor);

        const pillarGeo = new THREE.BoxGeometry(1.2, 18, 1.2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.7, metalness: 0.3 });
        [-10, 10].forEach(x => {
            [-10, 10].forEach(z => {
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(x, 8, z);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);
            });
        });

        const squares = {};
        const squareGeo = new THREE.BoxGeometry(1, 0.2, 1);
        const darkSquareMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.4, metalness: 0.3 });
        const lightSquareMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.4, metalness: 0.3 });
        const highlightMat = new THREE.MeshStandardMaterial({ color: 0xa78bfa, roughness: 0.2, emissive: 0x7c3aed, emissiveIntensity: 0.6 });

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const isLight = (r + c) % 2 === 0;
                const mat = isLight ? lightSquareMat.clone() : darkSquareMat.clone();
                const mesh = new THREE.Mesh(squareGeo, mat);
                const file = String.fromCharCode(97 + c);
                const rank = 8 - r;
                const squareName = file + rank;
                
                mesh.position.set(c - 3.5, 0, r - 3.5);
                mesh.receiveShadow = true;
                mesh.userData = { square: squareName, isLight: isLight, baseMat: mat };
                boardGroup.add(mesh);
                squares[squareName] = mesh;
            }
        }

        const trimGeo = new THREE.BoxGeometry(8.6, 0.25, 8.6);
        const trimMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8, roughness: 0.2 });
        const trim = new THREE.Mesh(trimGeo, trimMat);
        trim.position.set(0, -0.12, 0);
        trim.receiveShadow = true;
        boardGroup.add(trim);

        const pieceMeshes = {};
        const activeAnimations = [];

        const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.15, metalness: 0.3, envMapIntensity: 1.5 });
        const blackMaterial = new THREE.MeshStandardMaterial({ color: 0x09090b, roughness: 0.2, metalness: 0.8, envMapIntensity: 2.0 });

        function createPieceMesh(type, color) {
            const group = new THREE.Group();
            const mat = color === 'w' ? whiteMaterial : blackMaterial;
            
            const baseGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.15, 16);
            const base = new THREE.Mesh(baseGeo, mat);
            base.position.y = 0.075;
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            const bodyGeo = new THREE.CylinderGeometry(0.2, 0.3, 0.6, 16);
            const body = new THREE.Mesh(bodyGeo, mat);
            body.position.y = 0.45;
            body.castShadow = true;
            group.add(body);

            if (type === 'p') {
                const headGeo = new THREE.SphereGeometry(0.22, 16, 16);
                const head = new THREE.Mesh(headGeo, mat);
                head.position.y = 0.85;
                head.castShadow = true;
                group.add(head);
            } else if (type === 'r') {
                const topGeo = new THREE.CylinderGeometry(0.28, 0.24, 0.3, 16);
                const top = new THREE.Mesh(topGeo, mat);
                top.position.y = 0.9;
                top.castShadow = true;
                group.add(top);
            } else if (type === 'n') {
                const neckGeo = new THREE.BoxGeometry(0.2, 0.5, 0.35);
                const neck = new THREE.Mesh(neckGeo, mat);
                neck.position.set(0, 0.8, 0.05);
                neck.rotation.x = -0.2;
                neck.castShadow = true;
                group.add(neck);
            } else if (type === 'b') {
                const mitreGeo = new THREE.ConeGeometry(0.2, 0.6, 16);
                const mitre = new THREE.Mesh(mitreGeo, mat);
                mitre.position.y = 1.0;
                mitre.castShadow = true;
                group.add(mitre);
            } else if (type === 'q') {
                const crownGeo = new THREE.CylinderGeometry(0.32, 0.2, 0.5, 16);
                const crown = new THREE.Mesh(crownGeo, mat);
                crown.position.y = 0.95;
                crown.castShadow = true;
                group.add(crown);
            } else if (type === 'k') {
                const crownGeo = new THREE.CylinderGeometry(0.3, 0.22, 0.6, 16);
                const crown = new THREE.Mesh(crownGeo, mat);
                crown.position.y = 1.0;
                crown.castShadow = true;
                group.add(crown);
                
                const crossGeo = new THREE.BoxGeometry(0.12, 0.3, 0.12);
                const cross = new THREE.Mesh(crossGeo, mat);
                cross.position.y = 1.45;
                cross.castShadow = true;
                group.add(cross);
            }

            group.userData = { type: type, color: color };
            return group;
        }

        function squareToVector3(sq) {
            const file = sq.charCodeAt(0) - 97;
            const rank = 8 - parseInt(sq[1]);
            return new THREE.Vector3(file - 3.5, 0, rank - 3.5);
        }

        function syncBoardTo3D() {
            Object.values(pieceMeshes).forEach(mesh => boardGroup.remove(mesh));
            for (let k in pieceMeshes) delete pieceMeshes[k];

            const board = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const file = String.fromCharCode(97 + c);
                        const rank = 8 - r;
                        const sq = file + rank;
                        const mesh = createPieceMesh(piece.type, piece.color);
                        const pos = squareToVector3(sq);
                        mesh.position.copy(pos);
                        boardGroup.add(mesh);
                        pieceMeshes[sq] = mesh;
                    }
                }
            }
        }

        function triggerShatterAnimation(sq, pieceColor, pieceType) {
            playSound('shatter');
            const pos = squareToVector3(sq);
            pos.y += 0.5;

            capturedPiecesData[pieceColor].push(pieceType);
            updateCapturedUI();

            const shardGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const shardMat = new THREE.MeshStandardMaterial({
                color: pieceColor === 'w' ? 0xf8fafc : 0x18181b,
                roughness: 0.2,
                metalness: 0.8,
                emissive: pieceColor === 'w' ? 0x475569 : 0x7c3aed,
                emissiveIntensity: 0.5
            });

            const shardGroup = new THREE.Group();
            shardGroup.position.copy(pos);
            scene.add(shardGroup);

            const shards = [];
            for (let i = 0; i < 35; i++) {
                const mesh = new THREE.Mesh(shardGeo, shardMat);
                mesh.position.set((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4);
                shardGroup.add(mesh);
                shards.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 8 + 2, (Math.random() - 0.5) * 6),
                    rotationSpeed: new THREE.Vector3(Math.random() * 10, Math.random() * 10, Math.random() * 10)
                });
            }

            activeAnimations.push({
                update: (dt) => {
                    let allFaded = true;
                    shards.forEach(s => {
                        s.velocity.y -= 18 * dt;
                        s.mesh.position.addScaledVector(s.velocity, dt);
                        s.mesh.rotation.x += s.rotationSpeed.x * dt;
                        s.mesh.rotation.y += s.rotationSpeed.y * dt;
                        s.mesh.scale.multiplyScalar(0.95);
                        if (s.mesh.scale.x > 0.05) allFaded = false;
                    });
                    if (allFaded || shards[0].mesh.position.y < -2) {
                        scene.remove(shardGroup);
                        return true;
                    }
                    return false;
                }
            });
        }

        function updateCapturedUI() {
            const obsidianContainer = document.getElementById('capturedObsidian');
            const marbleContainer = document.getElementById('capturedMarble');
            const symbolMap = { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' };

            obsidianContainer.innerHTML = capturedPiecesData.b.length ? 
                capturedPiecesData.b.map(p => `<span class="text-sm text-violet-300 font-bold">${symbolMap[p]}</span>`).join('') :
                '<span class="text-[10px] text-slate-500 italic">None</span>';

            marbleContainer.innerHTML = capturedPiecesData.w.length ? 
                capturedPiecesData.w.map(p => `<span class="text-sm text-slate-200 font-bold">${symbolMap[p]}</span>`).join('') :
                '<span class="text-[10px] text-slate-500 italic">None</span>';
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#gameModal') || e.target.closest('header') || e.target.closest('.absolute')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boardGroup.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== boardGroup && !obj.userData.square) {
                    obj = obj.parent;
                }

                let clickedSquare = null;
                if (obj.userData && obj.userData.square) {
                    clickedSquare = obj.userData.square;
                } else {
                    for (let sq in pieceMeshes) {
                        if (pieceMeshes[sq] === obj || pieceMeshes[sq].children.includes(obj) || pieceMeshes[sq].children.some(c => c.children.includes(obj))) {
                            clickedSquare = sq;
                            break;
                        }
                    }
                }

                if (clickedSquare) handleSquareClick(clickedSquare);
            }
        });

        function clearHighlights() {
            for (let sq in squares) squares[sq].material = squares[sq].userData.baseMat;
        }

        function highlightSquares(squaresList) {
            clearHighlights();
            squaresList.forEach(sq => { if (squares[sq]) squares[sq].material = highlightMat; });
        }

        function handleSquareClick(sq) {
            if (isAnimating) return;
            const piece = chess.get(sq);

            if (selectedSquare === null) {
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = sq;
                    playSound('select');
                    const legalMoves = chess.moves({ square: sq, verbose: true });
                    validMoves = legalMoves.map(m => m.to);
                    highlightSquares([sq, ...validMoves]);
                }
            } else {
                if (selectedSquare === sq) {
                    selectedSquare = null;
                    clearHighlights();
                    validMoves = [];
                    return;
                }

                if (validMoves.includes(sq)) {
                    executeMove({ from: selectedSquare, to: sq, promotion: 'q' });
                } else if (piece && piece.color === chess.turn()) {
                    selectedSquare = sq;
                    playSound('select');
                    const legalMoves = chess.moves({ square: sq, verbose: true });
                    validMoves = legalMoves.map(m => m.to);
                    highlightSquares([sq, ...validMoves]);
                } else {
                    selectedSquare = null;
                    clearHighlights();
                    validMoves = [];
                }
            }
        }

        function executeMove(moveObj) {
            isAnimating = true;
            clearHighlights();

            const targetPiece = chess.get(moveObj.to);
            if (targetPiece) triggerShatterAnimation(moveObj.to, targetPiece.color, targetPiece.type);

            const result = chess.move(moveObj);
            if (result) {
                playSound('move');
                recordMove(result);
                
                const mesh = pieceMeshes[moveObj.from];
                if (mesh) {
                    delete pieceMeshes[moveObj.from];
                    pieceMeshes[moveObj.to] = mesh;
                    const startPos = mesh.position.clone();
                    const endPos = squareToVector3(moveObj.to);
                    let progress = 0;

                    activeAnimations.push({
                        update: (dt) => {
                            progress += dt * 4;
                            if (progress >= 1) {
                                mesh.position.copy(endPos);
                                isAnimating = false;
                                checkGameStatus();
                                return true;
                            }
                            mesh.position.lerpVectors(startPos, endPos, progress);
                            mesh.position.y = Math.sin(progress * Math.PI) * 1.5;
                            return false;
                        }
                    });
                } else {
                    syncBoardTo3D();
                    isAnimating = false;
                    checkGameStatus();
                }
            }

            selectedSquare = null;
            validMoves = [];
            updateTurnIndicator();

            if (!chess.game_over() && gameMode !== 'pvp' && chess.turn() === 'b' && !isAnimating) {
                setTimeout(makeAIMove, 600);
            }
        }

        function makeAIMove() {
            const moves = chess.moves({ verbose: true });
            if (moves.length === 0) return;
            let chosenMove = null;

            if (gameMode === 'easy') {
                chosenMove = moves[Math.floor(Math.random() * moves.length)];
            } else {
                let scoredMoves = moves.map(m => {
                    let score = 0;
                    if (m.captured) {
                        const values = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 50 };
                        score += values[m.captured] * 10;
                    }
                    if (m.san.includes('+')) score += 5;
                    score += Math.random() * 2;
                    return { move: m, score: score };
                });
                scoredMoves.sort((a, b) => b.score - a.score);
                chosenMove = scoredMoves[0].move;
            }

            if (chosenMove) executeMove({ from: chosenMove.from, to: chosenMove.to, promotion: chosenMove.promotion || 'q' });
        }

        function recordMove(move) {
            const list = document.getElementById('moveHistoryList');
            if (list.querySelector('.italic')) list.innerHTML = '';
            const div = document.createElement('div');
            div.className = "flex justify-between items-center py-1 px-2 rounded hover:bg-white/5";
            div.innerHTML = `<span class="text-slate-400">${chess.history().length}.</span> <span class="text-violet-200 font-semibold">${move.san}</span>`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function updateTurnIndicator() {
            const turn = chess.turn();
            const dot = document.getElementById('turnIndicatorDot');
            const text = document.getElementById('turnText');
            const mobDot = document.getElementById('mobileTurnDot');
            const mobText = document.getElementById('mobileTurnText');

            if (turn === 'w') {
                dot.className = "w-3 h-3 rounded-full bg-slate-100 shadow-sm shadow-white/50 animate-pulse";
                text.innerText = "White's Turn (Marble)";
                mobDot.className = "w-3.5 h-3.5 rounded-full bg-slate-100 animate-pulse";
                mobText.innerText = "White's Turn (Marble)";
            } else {
                dot.className = "w-3 h-3 rounded-full bg-violet-600 shadow-sm shadow-violet-600/50 animate-pulse";
                text.innerText = "Black's Turn (Obsidian)";
                mobDot.className = "w-3.5 h-3.5 rounded-full bg-violet-600 animate-pulse";
                mobText.innerText = "Black's Turn (Obsidian)";
            }
        }

        function checkGameStatus() {
            if (chess.game_over()) {
                let title = "Game Over";
                let desc = "The battle has concluded.";
                if (chess.in_checkmate()) {
                    title = "Checkmate!";
                    const winner = chess.turn() === 'w' ? 'Obsidian (Black)' : 'Marble (White)';
                    desc = `${winner} has conquered the cathedral!`;
                } else if (chess.in_draw()) {
                    title = "Draw";
                    desc = "The cathedral reaches a stalemate.";
                }
                showModal(title, desc);
            }
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function resetGame() {
            chess.reset();
            capturedPiecesData = { w: [], b: [] };
            updateCapturedUI();
            document.getElementById('moveHistoryList').innerHTML = '<div class="text-slate-500 italic text-center py-8">No spells cast yet...</div>';
            syncBoardTo3D();
            updateTurnIndicator();
            closeModal();
        }

        syncBoardTo3D();
        updateTurnIndicator();

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            controls.update();

            for (let i = activeAnimations.length - 1; i >= 0; i--) {
                if (activeAnimations[i].update(dt)) activeAnimations.splice(i, 1);
            }

            const time = clock.getElapsedTime();
            for (let sq in pieceMeshes) {
                const mesh = pieceMeshes[sq];
                mesh.position.y = squareToVector3(sq).y + Math.sin(time * 2 + mesh.position.x) * 0.03;
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
